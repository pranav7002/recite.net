name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: recite
          POSTGRES_PASSWORD: recite
          POSTGRES_DB: recite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recite:recite@localhost:5432/recite_test
      ANSWER_MODEL: test
      CHECK_MODEL: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: psql "$DATABASE_URL" -f backend/schema.sql
      - run: ruff check .
      - run: pytest -q
