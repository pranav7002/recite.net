services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recite
      POSTGRES_PASSWORD: recite
      POSTGRES_DB: recite
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recite"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
