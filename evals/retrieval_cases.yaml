- id: structural_04
  type: structural
  split: report
  question: On the slides demonstrating "Assessing Model Accuracy", what four specific metrics or curves are structurally represented by the Black, Orange, Red, and Grey curves in the plotted graphs?
  expected_pages:
  - doc: DS-2 (1)
    page: 16
  expected_answer: 'Black: true curve simulated from f. Orange: linear regression model. Red: test MSE. Grey: train MSE.'
- id: structural_05
  type: structural
  split: report
  question: How is the comparison between the three missing data mechanisms (MCAR, MAR, MNAR) structurally organized in terms of meaning and examples?
  expected_pages:
  - doc: DAI-101_Lecture_4 Variance_z score_preprocessing_missing data
    page: 11
  expected_answer: 'A table with columns Mechanism, Meaning and Example: MCAR (unrelated to any variable; OMR lost), MAR (depends on other observed columns; low-attendance students miss exams), MNAR (depends on the missing value itself; grades not reported due to poor grades).'
- id: structural_06
  type: structural
  split: heldout
  question: What is the structured three-step process outlined for calculating Variance as the "Average Squared Deviation"?
  expected_pages:
  - doc: DAI-101_Lecture_4 Variance_z score_preprocessing_missing data
    page: 2
  expected_answer: 'Step 1: deviations from the mean. Step 2: square them (all positive, large deviations weigh more). Step 3: average the squared deviations (σ² = 1000/5 = 200).'
