- id: structural_03
  type: structural
  split: report
  question: In the "Statistical Data Types — The Big Picture" slide, how is Quantitative data structurally sub-divided, and what are the corresponding measurement scales?
  expected_pages:
  - doc: DAI-101_Lecture_3_Data_Types_Mean_Median
    page: 9
